# Ambiente completo do experimento. Um comando sobe tudo:
#   docker compose up -d
#
# As imagens estao fixadas por digest (sha256), coletado em 2026-08-31 com
# scripts/coletar_versoes.py. Digest e imutavel: aponta sempre para os mesmos
# bytes, enquanto uma tag como 'latest' passa a apontar para outra coisa a
# qualquer momento. E isso que permite a um terceiro reconstruir o mesmo
# ambiente que produziu os resultados, meses depois.
#
# Ao trocar de versao propositalmente, atualize tambem docs/versoes.md e
# registre a troca em um ADR.

name: tcc-camada-protecao

services:

  # Assistente de referencia. Variavel de controle: o fluxo e identico nas 4 condicoes.
  n8n:
    image: docker.n8n.io/n8nio/n8n@sha256:a9e2e3c8006ed453238266669ea1274be7136f515abe290a2f75a0ab9044c93d
    container_name: tcc-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_SECURE_COOKIE=false
      - N8N_RUNNERS_ENABLED=true
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - tcc

  # Base vetorial da base de conhecimento (30 documentos sinteticos).
  qdrant:
    image: qdrant/qdrant@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc
    container_name: tcc-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - tcc

  # Condicao C, eixo de saida. Imagens atuais do projeto; as antigas em
  # mcr.microsoft.com estao descontinuadas.
  presidio-analyzer:
    image: ghcr.io/data-privacy-stack/presidio-analyzer@sha256:ae8f6f111ac2f04e3fec552f7f80edd0dcbfa2dd69ee1b9e030475be31669885
    container_name: tcc-presidio-analyzer
    restart: unless-stopped
    ports:
      - "5002:3000"
    networks:
      - tcc

  presidio-anonymizer:
    image: ghcr.io/data-privacy-stack/presidio-anonymizer@sha256:e567013893ebc80994e3799f6f55c86aa1f0b0fadb779571ab346f0ec45365c1
    container_name: tcc-presidio-anonymizer
    restart: unless-stopped
    ports:
      - "5001:3000"
    networks:
      - tcc

  # Condicao B. Na Etapa 0 apenas encaminha: nenhuma regra existe ainda.
  camada:
    build:
      context: ./camada
    container_name: tcc-camada
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./resultados:/app/resultados
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/saude')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - tcc

volumes:
  n8n_data:
  qdrant_data:

networks:
  tcc:
    driver: bridge
