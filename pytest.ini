[pytest]
# importlib: cada arquivo de teste e importado por caminho, e nao como modulo de um
# pacote homonimo. Sem isso, `camada/tests` e `recuperador/tests` colidem.
addopts = --import-mode=importlib -m "not lento"
# Apenas a raiz. Os servicos sao importados como `camada.app.main` e
# `recuperador.app.main`, que sao nomes unicos; dentro de cada conteiner o mesmo
# codigo e importado como `app.main`, e por isso os imports internos sao relativos.
pythonpath = .
testpaths = camada/tests executor/tests recuperador/tests modelo/tests scripts/tests
markers =
    lento: exige baixar o modelo de embeddings (1 GB). Rode com `pytest -m lento`.
