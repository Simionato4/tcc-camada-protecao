# Ambiente completo do experimento. Um comando sobe tudo:
#   docker compose up -d
#
# As tags estao em 'latest' apenas ate a tarefa 0.10. Depois de subir a primeira
# vez, rode scripts/coletar_versoes.py, registre o digest de cada imagem em
# docs/versoes.md e TROQUE 'latest' pelo digest. A partir dai o ambiente e
# reproduzivel por terceiros, que e o que a proposta promete.

name: tcc-camada-protecao

services:

  # Assistente de referencia. Variavel de controle: o fluxo e identico nas 4 condicoes.
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: tcc-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_SECURE_COOKIE=false
      - N8N_RUNNERS_ENABLED=true
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - tcc

  # Base vetorial da base de conhecimento (30 documentos sinteticos).
  qdrant:
    image: qdrant/qdrant:latest
    container_name: tcc-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - tcc

  # Condicao C, eixo de saida. Imagens atuais do projeto; as antigas em
  # mcr.microsoft.com estao descontinuadas.
  presidio-analyzer:
    image: ghcr.io/data-privacy-stack/presidio-analyzer:latest
    container_name: tcc-presidio-analyzer
    restart: unless-stopped
    ports:
      - "127.0.0.1:5002:3000"
    networks:
      - tcc

  presidio-anonymizer:
    image: ghcr.io/data-privacy-stack/presidio-anonymizer:latest
    container_name: tcc-presidio-anonymizer
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:3000"
    networks:
      - tcc

  # Parte do assistente de referencia, nao da camada. Fica separado de proposito:
  # a camada e o objeto avaliado na condicao B, e sua latencia interna e um
  # indicador do trabalho — acrescentar vetorizacao e consulta ao Qdrant dentro
  # dela tornaria o tempo_ms incomparavel com as demais condicoes (ADR-0011).
  recuperador:
    build:
      context: ./recuperador
    container_name: tcc-recuperador
    restart: unless-stopped
    ports:
      - "127.0.0.1:8100:8100"
    environment:
      - VERSAO_INDICE=${VERSAO_INDICE:-0.0.0-stub}
      - QDRANT_URL=http://qdrant:6333
      - MODO_INDICE=${MODO_INDICE:-qdrant}
      - MODELO_EMBEDDINGS=sentence-transformers/paraphrase-multilingual-mpnet-base-v2
      - COLECAO_QDRANT=base_conhecimento
      - CACHE_MODELOS=/opt/modelos
      - PASTA_BASE_CONHECIMENTO=/app/base_conhecimento
    volumes:
      # Somente leitura: o servico consulta a base, nunca a altera. Quem altera e o
      # gerador, na maquina, e o procedimento de indexacao, que recria a colecao.
      - ./base_conhecimento:/app/base_conhecimento:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/saude')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - tcc

  # Unico ponto do fluxo autorizado a chamar o modelo de linguagem. Existe para que
  # o n8n nao chame a API diretamente: o gasto ocorreria fora do guarda de
  # orcamento, fora do contador e fora do teto.
  modelo:
    build:
      context: .
      dockerfile: modelo/Dockerfile
    container_name: tcc-modelo
    restart: unless-stopped
    ports:
      - "127.0.0.1:8200:8200"
    environment:
      # Menor privilegio: recebe apenas o que usa. Nao recebe QDRANT_URL, nem as
      # credenciais de outros servicos (RQ-15).
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - MODELO_ID=${MODELO_ID}
      - TEMPERATURA=${TEMPERATURA:-0}
      - MAX_TOKENS_SAIDA=${MAX_TOKENS_SAIDA:-400}
      - MODO_SIMULADO=${MODO_SIMULADO:-1}
      - TETO_CHAMADAS=${TETO_CHAMADAS:-8500}
      - TETO_USD=${TETO_USD:-16.00}
      - CUSTO_ESTIMADO_CHAMADA_USD=${CUSTO_ESTIMADO_CHAMADA_USD:-0.0025}
      - PRECO_ENTRADA_USD_MTOK=${PRECO_ENTRADA_USD_MTOK:-1.0}
      - PRECO_SAIDA_USD_MTOK=${PRECO_SAIDA_USD_MTOK:-5.0}
      - ARQUIVO_CONSUMO=/app/resultados/consumo.json
      - CAMINHO_PROMPT=/app/assistente/prompt_sistema.md
    volumes:
      - ./assistente:/app/assistente:ro
      - ./resultados:/app/resultados
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8200/saude')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - tcc

  # Condicao B. Na Etapa 0 apenas encaminha: nenhuma regra existe ainda.
  camada:
    build:
      context: ./camada
    container_name: tcc-camada
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - ./resultados:/app/resultados
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/saude')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - tcc

volumes:
  n8n_data:
  qdrant_data:

networks:
  tcc:
    driver: bridge
