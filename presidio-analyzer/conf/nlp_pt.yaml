# Configuracao do processamento de linguagem do Presidio para a condicao C (ADR-0022).
# Copia de presidio_analyzer/conf/default.yaml da imagem fixada (analyzer 2.2.364),
# com UMA alteracao: lang_code en -> pt e model_name en_core_web_lg -> pt_core_news_lg.
# O mapeamento de entidades, o multiplicador de baixa confianca e a lista de rotulos
# ignorados sao identicos ao original. O modelo pt tem os rotulos PER, LOC, ORG e MISC
# (sem rotulo de data); MISC nao tem mapeamento no original e nenhum foi criado.
nlp_engine_name: spacy
models:
  -
    lang_code: pt
    model_name: pt_core_news_lg

ner_model_configuration:
  model_to_presidio_entity_mapping:
    PER: PERSON
    PERSON: PERSON
    NORP: NRP
    FAC: LOCATION
    LOC: LOCATION
    GPE: LOCATION
    LOCATION: LOCATION
    ORG: ORGANIZATION
    ORGANIZATION: ORGANIZATION
    DATE: DATE_TIME
    TIME: DATE_TIME

  low_confidence_score_multiplier: 0.4
  low_score_entity_names:
  -
  labels_to_ignore:
  - ORGANIZATION # Has many false positives
  - CARDINAL
  - EVENT
  - LANGUAGE
  - LAW
  - MONEY
  - ORDINAL
  - PERCENT
  - PRODUCT
  - QUANTITY
  - WORK_OF_ART
