# Ambiente completo do experimento. Um comando sobe tudo:
#   docker compose up -d
#
# As tags estao em 'latest' apenas ate a tarefa 0.10. Depois de subir a primeira
# vez, rode scripts/coletar_versoes.py, registre o digest de cada imagem em
# docs/versoes.md e TROQUE 'latest' pelo digest. A partir dai o ambiente e
# reproduzivel por terceiros, que e o que a proposta promete.

name: tcc-camada-protecao

services:

  # Assistente de referencia. Variavel de controle: o fluxo e identico nas 4 condicoes.
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: tcc-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_SECURE_COOKIE=false
      - N8N_RUNNERS_ENABLED=true
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - tcc

  # Base vetorial da base de conhecimento (30 documentos sinteticos).
  qdrant:
    image: qdrant/qdrant:latest
    container_name: tcc-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - tcc

  # Condicao C, eixo de saida. Imagens atuais do projeto; as antigas em
  # mcr.microsoft.com estao descontinuadas.
  presidio-analyzer:
    image: ghcr.io/data-privacy-stack/presidio-analyzer:latest
    container_name: tcc-presidio-analyzer
    restart: unless-stopped
    ports:
      - "127.0.0.1:5002:3000"
    networks:
      - tcc

  presidio-anonymizer:
    image: ghcr.io/data-privacy-stack/presidio-anonymizer:latest
    container_name: tcc-presidio-anonymizer
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:3000"
    networks:
      - tcc

  # Condicao B. Na Etapa 0 apenas encaminha: nenhuma regra existe ainda.
  camada:
    build:
      context: ./camada
    container_name: tcc-camada
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - ./resultados:/app/resultados
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/saude')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - tcc

volumes:
  n8n_data:
  qdrant_data:

networks:
  tcc:
    driver: bridge
